spring.application.name=university-db-app
spring.config.import=optional:classpath:secrets.properties

# MySQL connection (XAMPP defaults: user root, empty password)
# Create university_db yourself by running sql/schema.sql. Spring Boot never creates it.
spring.datasource.url=jdbc:mysql://localhost:3306/university_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# validate only checks that entity mappings match the existing schema; it never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
